name: resto-hub

# Prérequis : Docker Desktop / Docker Engine + Compose v2.
# Copier infra/.env.example vers .env à la racine (jamais versionné).

services:
  postgres:
    image: postgres:16-alpine
    container_name: resto-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resto_hub
      POSTGRES_PASSWORD: ${RESTO_DB_PASSWORD:?définir RESTO_DB_PASSWORD (voir infra/.env.example)}
      POSTGRES_DB: resto_identity
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./infra/postgres/20-role-password.sh:/docker-entrypoint-initdb.d/20-role-password.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resto_hub -d resto_identity']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: resto-hub-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${RESTO_REDIS_PASSWORD:?définir RESTO_REDIS_PASSWORD (voir infra/.env.example)}',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${RESTO_REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: resto-hub-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER (voir infra/.env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD (voir infra/.env.example)}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: resto-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/resto-hub-media &&
      mc anonymous set download local/resto-hub-media &&
      echo 'Bucket resto-hub-media prêt.'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER (voir infra/.env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD (voir infra/.env.example)}
    restart: 'no'

volumes:
  pgdata:
  redisdata:
  miniodata:
